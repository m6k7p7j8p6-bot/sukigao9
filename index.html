<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好きな顔9</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f7f7;
      text-align: center;
      color: #333;
    }

    h1 {
      margin-top: 50px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 20px;
    }

    .person {
      width: 45%;
      max-width: 300px;
      background: white;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .person img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
    }

    .person h2 {
      margin: 10px 0;
    }

    .person:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <h1>好きな顔9</h1>

  <p>どっちの顔が好き？</p>

  <div class="choices">

    <div class="person" onclick="choose('A')">
      <img src="https://picsum.photos/500/500?random=1">
      <h2>A</h2>
    </div>

    <div class="person" onclick="choose('B')">
      <img src="https://picsum.photos/500/500?random=2">
      <h2>B</h2>
    </div>

  </div>

  <p id="result"></p>

  <script>
    function choose(person) {
      document.getElementById("result").textContent =
        person + "を選びました！";
    }
  </script>

</body>
</html>
